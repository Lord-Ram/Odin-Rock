<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <div class="icons" aria-hidden="true">
        <span>✊</span><span>✋</span><span>✌️</span>
      </div>
      <h1>Rock Paper Scissors</h1>
      <p class="subtitle">Best of 5 rounds against the computer</p>

      <ol class="steps">
        <li>Press <kbd>F12</kbd> to open the browser console.</li>
        <li>Click <strong>Start Game</strong> below.</li>
        <li>Type <em>rock</em>, <em>paper</em> or <em>scissors</em> when prompted.</li>
      </ol>

      <button id="start-btn" type="button">Start Game</button>
      <p class="hint">Click the button again any time to play a new game.</p>
    </main>
  </body>
</html>
